# Serves the built SPA. Used only by the production image (web/Dockerfile);
# development runs the Vite dev server instead.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing. /my-trips, /trip/{id} and /chat/{id} exist in the
    # React router and nowhere on disk, so a refresh or a pasted deep link asks
    # nginx for a file that is not there. Without this fallback that is a 404
    # on every route but "/", which looks like the app is broken rather than
    # like the server never heard of the path.
    #
    # $uri first so a real file still wins: the fallback must not swallow a
    # request for a hashed asset that genuinely is missing and turn it into an
    # HTML page, which fails later and much less legibly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets, so the content of a given URL
    # never changes and it can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file that must not be cached: it is what points at
    # the current hashed bundle, and a stale copy pins the browser to a
    # deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
