# Applied with kubectl, not Terraform: this configuration has no kubernetes
# provider on purpose (see terraform/cluster/providers.tf).
#
#   kubectl apply -f terraform/cluster/manifests/gp3-storageclass.yaml
#
# EKS ships a `gp2` StorageClass already marked default. Two default classes is
# an error state, so demote it in the same step:
#
#   kubectl patch storageclass gp2 \
#     -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
# WaitForFirstConsumer delays volume creation until a pod is scheduled, so the
# EBS volume lands in the same availability zone as the pod that claims it. With
# Immediate binding the Postgres StatefulSet can get a volume in one AZ and a
# pod that cannot be scheduled in the other, and stays Pending forever.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
