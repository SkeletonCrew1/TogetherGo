# Traefik v3 dynamic configuration — the routing table.
#
# Watched by the file provider (see traefik.yml), so edits here take effect
# without restarting the gateway. On Docker Desktop for macOS the inotify event
# does not reliably cross the bind mount, so if a change here does not seem to
# have landed, check the loaded rule at http://localhost:8081/api/http/routers
# and `docker compose restart gateway`.
#
# Routing table (see CLAUDE.md):
#
#   /api/auth/*     -> identity      http://identity:8001   [live]
#   /api/users/*    -> identity                             [live]
#   /api/ratings/*  -> identity                             [live]
#   /.well-known/*  -> identity                             [live]
#   /api/trips/*    -> trip          http://trip:8002       [live]
#   /api/my/*       -> trip                                 [live]
#   /api/chat/*     -> chat          http://chat:8003       [live]
#   /ws/chat/*      -> chat          (websocket; Traefik proxies the upgrade
#                                     with no extra configuration)          [live]
#   everything else -> web           http://web:5173  (the SPA)          [live]
#
# notification is deliberately absent: it has no public surface beyond its
# health endpoints, and is reached only over the internal network.
#
# A router whose service has no running container makes the gateway report it
# as unavailable, so routes are added as each service comes up rather than
# all at once.
#
# ---------------------------------------------------------------------------
# /internal is NOT routed here, and that is a security boundary, not an
# oversight.
#
# `GET /internal/users` resolves user ids to display data for the trip and
# chat services. No rule below matches `/internal`, so a request for it
# through the gateway is a 404 from Traefik that never reaches the
# application — the endpoint is unreachable from outside the Compose network,
# not merely unauthorised. The X-Internal-Token check in the service is the
# second line of defence behind this one, because in Compose every service
# shares a network with every other.
#
# The `web` router below is a catch-all, and it carries an explicit
# `!PathPrefix(`/internal`)` for exactly this reason. Without it the catch-all
# would match, and while it would forward the request to the SPA rather than to
# identity, "404 from Traefik" would have quietly become "200 with an HTML
# page" — a weaker property, and one nobody would notice had changed.
#
# The rule is asserted in code, not just here:
# services/identity/tests/test_gateway_routes.py parses this file and fails if
# any router's rule would match /internal.
# ---------------------------------------------------------------------------

http:
  routers:
    identity:
      # /api/ratings belongs to identity because a rating is a property of a
      # user, not of a trip: the aggregate has to be readable from a profile
      # without touching the trip service. `/api/users/{id}/ratings` is served
      # by the same service and already covered by the /api/users prefix.
      #
      # /.well-known carries the JWKS document. Other services fetch it over
      # the internal network at http://identity:8001 and do not need this
      # route, but a browser SPA validating a token, and any external tool
      # that has to check a signature, reach it through the gateway.
      rule: >-
        PathPrefix(`/api/auth`)
        || PathPrefix(`/api/users`)
        || PathPrefix(`/api/ratings`)
        || PathPrefix(`/.well-known`)
      entryPoints:
        - web
      service: identity

    chat:
      # Both prefixes on one router, because they are one service and the
      # split is a protocol boundary rather than a routing one: /api/chat is
      # ordinary REST, /ws/chat is the socket those REST calls hand out tickets
      # for.
      #
      # Traefik v3 proxies a websocket upgrade with no configuration at all —
      # no middleware, no annotation, no `Connection: upgrade` header to set by
      # hand. It detects the upgrade and switches the connection to a raw
      # bidirectional stream. What it does *not* do is keep it open forever
      # against a backend that is not answering, which is why the service pings
      # its own sockets rather than relying on the gateway to notice.
      #
      # It also does not, by default, let one live past sixty seconds: the
      # `web` entrypoint's readTimeout is a deadline on the whole request and a
      # handshake is a request that never ends. It is pinned to 0 in
      # deploy/traefik/traefik.yml, and this route is the reason.
      rule: PathPrefix(`/api/chat`) || PathPrefix(`/ws/chat`)
      entryPoints:
        - web
      service: chat

    trip:
      # Both prefixes on one router, because they are one service and the split
      # is a question of what is being addressed rather than of where it lives:
      # /api/trips is the catalogue, addressed by trip id, and /api/my is the
      # dashboard, addressed by the bearer token and nothing else.
      rule: PathPrefix(`/api/trips`) || PathPrefix(`/api/my`)
      entryPoints:
        - web
      service: trip

    web:
      # The SPA, and the reason it is here rather than on its own port: served
      # from this entrypoint it is same-origin with the API, which is what
      # removes the CORS grant and the websocket Origin rejection that a
      # separate localhost:5173 made necessary. In development this is the Vite
      # dev server; the HMR websocket rides the same catch-all, which Traefik
      # upgrades exactly as it does /ws/chat.
      #
      # `!PathPrefix(`/internal`)` is load-bearing, not tidiness. A bare
      # catch-all would match /internal/users, and while it would forward it to
      # the SPA rather than to identity, the acceptance criterion for that
      # boundary is a 404 *from Traefik* — a request that never reaches an
      # application at all. Excluding it here keeps that literally true, and
      # keeps tests/test_gateway_routes.py able to assert it.
      rule: PathPrefix(`/`) && !PathPrefix(`/internal`)
      entryPoints:
        - web
      service: web
      # Explicit, and low. Traefik orders routers by priority and falls back to
      # the rule's *length* when none is given — which would leave "does the API
      # win over the catch-all" depending on how many characters a rule happens
      # to be, and quietly flip the day a prefix is renamed. 1 is the lowest
      # Traefik accepts, and every API router above keeps its length-derived
      # priority, all of which are far larger. The failure this prevents is the
      # confusing one: the page loads, and every API call comes back as the
      # SPA's index.html.
      priority: 1

  services:
    identity:
      loadBalancer:
        servers:
          - url: "http://identity:8001"
        # Traefik's own view of whether the backend can serve traffic. It
        # asks /readyz rather than /healthz: an instance whose database is
        # gone is alive but must not be sent requests.
        healthCheck:
          path: /readyz
          interval: "10s"
          timeout: "3s"

    chat:
      loadBalancer:
        # One server entry and any number of containers behind it.
        # `docker compose up --scale chat=2` puts two containers on the
        # `chat` DNS name, Docker's embedded resolver returns both, and Traefik
        # dials whichever it is given — so the gateway needs no change to
        # scale, and neither does this file.
        #
        # Which replica a socket lands on does not matter: the Redis fan-out is
        # what makes them one room, so there is no sticky session here and none
        # is needed.
        servers:
          - url: "http://chat:8003"
        # /readyz, not /healthz: an instance whose Redis is gone can issue no
        # tickets and deliver no message from another replica. It is alive and
        # it must not be sent traffic.
        healthCheck:
          path: /readyz
          interval: "10s"
          timeout: "3s"

    trip:
      loadBalancer:
        servers:
          - url: "http://trip:8002"
        # /readyz, not /healthz: an instance whose database or whose view of
        # identity's JWKS is gone is alive but must not be sent requests.
        healthCheck:
          path: /readyz
          interval: "10s"
          timeout: "3s"

    web:
      loadBalancer:
        # 5173 is the Vite dev server's port *inside* the container. It is not
        # published to the host and must not be: the whole point of this router
        # is that there is exactly one origin, http://localhost:8080, and a
        # second way in would bring back the two-origin problem it removes.
        servers:
          - url: "http://web:5173"
        # No healthCheck here, unlike the three services above. Traefik's
        # active health check is an HTTP GET, and there is no path on a Vite
        # dev server that answers one without also being a route of the
        # application. The container has its own HEALTHCHECK
        # (web/Dockerfile.dev), which is what `make up --wait` waits on.
