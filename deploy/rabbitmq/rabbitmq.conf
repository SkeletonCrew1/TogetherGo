# TogetherGo — RabbitMQ node configuration.
#
# Mounted at /etc/rabbitmq/rabbitmq.conf. The container entrypoint additionally
# writes default_user / default_pass into /etc/rabbitmq/conf.d/ from
# RABBITMQ_DEFAULT_USER and RABBITMQ_DEFAULT_PASS, so credentials stay in .env
# and out of this file.

# Declare the whole topology at boot from deploy/rabbitmq/definitions.json
# rather than letting whichever service starts first create it. Import is a
# merge: existing entities are left alone, missing ones are created, so this is
# safe on both a fresh volume and a restart.
load_definitions = /etc/rabbitmq/definitions.json
