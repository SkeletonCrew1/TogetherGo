apiVersion: batch/v1
kind: Job
metadata:
  name: togethergo-rds-bootstrap
  namespace: togethergo
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: togethergo-rds-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: postgres:17-alpine
          command: [sh, -c, "psql -v ON_ERROR_STOP=1 -f /bootstrap/01-databases.sql"]
          env:
            - {name: PGHOST, valueFrom: {secretKeyRef: {name: togethergo-rds-bootstrap, key: host}}}
            - {name: PGPORT, value: "5432"}
            - {name: PGDATABASE, value: togethergo}
            - {name: PGUSER, valueFrom: {secretKeyRef: {name: togethergo-rds-bootstrap, key: username}}}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: togethergo-rds-bootstrap, key: password}}}
            - {name: IDENTITY_DB_PASSWORD, valueFrom: {secretKeyRef: {name: togethergo-rds-bootstrap, key: identity-password}}}
            - {name: TRIP_DB_PASSWORD, valueFrom: {secretKeyRef: {name: togethergo-rds-bootstrap, key: trip-password}}}
            - {name: CHAT_DB_PASSWORD, valueFrom: {secretKeyRef: {name: togethergo-rds-bootstrap, key: chat-password}}}
            - {name: NOTIFICATION_DB_PASSWORD, valueFrom: {secretKeyRef: {name: togethergo-rds-bootstrap, key: notification-password}}}
          volumeMounts:
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
      volumes:
        - name: bootstrap
          configMap:
            name: togethergo-rds-bootstrap

