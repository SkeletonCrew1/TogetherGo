apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: togethergo}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          ports: [{name: postgres, containerPort: 5432}]
          envFrom: [{secretRef: {name: togethergo-test-infrastructure}}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: init, configMap: {name: togethergo-postgres-init}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: togethergo}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: togethergo}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --appendonly, "no"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: togethergo}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rabbitmq, namespace: togethergo}
spec:
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq}}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          volumeMounts:
            - {name: config, mountPath: /etc/rabbitmq/rabbitmq.conf, subPath: rabbitmq.conf, readOnly: true}
            - {name: config, mountPath: /etc/rabbitmq/definitions.json, subPath: definitions.json, readOnly: true}
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 150m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
      volumes:
        - {name: config, configMap: {name: togethergo-rabbitmq-config}}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: togethergo}
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}

