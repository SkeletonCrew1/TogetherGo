{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "togethergo.secretName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "togethergo.labels" . | nindent 4 }}
type: Opaque
stringData:
  IDENTITY_DATABASE_URL: {{ required "secrets.values.IDENTITY_DATABASE_URL is required when existingSecret is empty" (index .Values.secrets.values "IDENTITY_DATABASE_URL") | quote }}
  TRIP_DATABASE_URL: {{ required "secrets.values.TRIP_DATABASE_URL is required when existingSecret is empty" (index .Values.secrets.values "TRIP_DATABASE_URL") | quote }}
  CHAT_DATABASE_URL: {{ required "secrets.values.CHAT_DATABASE_URL is required when existingSecret is empty" (index .Values.secrets.values "CHAT_DATABASE_URL") | quote }}
  RABBITMQ_URL: {{ required "secrets.values.RABBITMQ_URL is required when existingSecret is empty" (index .Values.secrets.values "RABBITMQ_URL") | quote }}
  INTERNAL_API_TOKEN: {{ required "secrets.values.INTERNAL_API_TOKEN is required when existingSecret is empty" (index .Values.secrets.values "INTERNAL_API_TOKEN") | quote }}
{{- end }}

