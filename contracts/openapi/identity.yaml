    UpdateProfileRequest:
      properties:
        full_name:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Full Name
        bio:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Bio
        phone:
