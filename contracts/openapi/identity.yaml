      required:
      - id
      - email
      - full_name
      - rating_count
      - is_active
      - created_at
      - updated_at
      title: PrivateProfile
      description: 'GET /api/users/me, and the `user` of an auth response.


        The only shape that carries email, phone and birth date. Never returned

        for anyone but the authenticated caller themselves.'
    PublicProfile:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        full_name:
          type: string
          title: Full Name
        bio:
          anyOf:
          - type: string
          - type: 'null'
          title: Bio
        photo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Photo Url
        age:
          anyOf:
          - type: integer
          - type: 'null'
          title: Age
        rating_avg:
          anyOf:
          - type: number
          - type: 'null'
          title: Rating Avg
        rating_count:
          type: integer
          title: Rating Count
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - full_name
      - rating_count
      - created_at
      title: PublicProfile
      description: "GET /api/users/{id} \u2014 what one traveller may see about another.\n\nEmail and\
        \ phone are absent from the model, not merely unset, so there is\nno code path that can fill them\
        \ in. `birth_date` is absent for the same\nreason: `age` is the only thing a co-traveller needs,\
        \ and it is derived\nfrom the date rather than exposing it."
    RatingSubmitted:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        trip_id:
          type: string
          format: uuid
          title: Trip Id
        ratee_id:
          type: string
          format: uuid
          title: Ratee Id
        score:
          type: integer
          title: Score
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        created_at:
          type: string
          format: date-time
          title: Created At
        ratee_rating_avg:
          anyOf:
          - type: number
          - type: 'null'
          title: Ratee Rating Avg
        ratee_rating_count:
