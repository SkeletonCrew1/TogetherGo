      title: UpdateProfileRequest
      description: "PATCH /api/users/me.\n\nEvery field is optional and absence means \"leave it alone\"\
        . For the three\nnullable ones an explicit `null` is a real instruction \u2014 clear the value\
        \ \u2014\nwhich is why the service works from `model_fields_set` and not from a\ndict of non-None\
        \ values."
