          minLength: 10
          title: Password
        full_name:
          type: string
          maxLength: 64
          minLength: 1
          title: Full Name
        birth_date:
          type: string
          format: date
          title: Birth Date
        bio:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
