      properties:
        users:
          items:
            $ref: '#/components/schemas/InternalUser'
          type: array
          title: Users
      type: object
      required:
      - users
      title: InternalUsersResponse
      description: "`{\"users\": [...]}` \u2014 an object, not a bare array.\n\nIds that matched nothing\
        \ are simply absent, so the list is not positional\nand callers must key it by `id`. Wrapping\
        \ it leaves room to add a\nsibling field later without breaking every caller's parser."
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 256
          minLength: 1
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    LogoutRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 512
          minLength: 1
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: LogoutRequest
    PendingRatee:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        full_name:
          type: string
          title: Full Name
        photo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Photo Url
      type: object
      required:
      - user_id
      - full_name
      title: PendingRatee
      description: "One person the caller still owes a rating, on one trip.\n\nThe display fields come\
